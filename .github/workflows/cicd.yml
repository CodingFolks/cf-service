name: Full Stack CI/CD

on:
  push:
    branches: [ github_actions, main ]
  pull_request:
    branches: [ github_actions, main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout frontend repository
        uses: actions/checkout@v3
        with:
          repository: CodingFolks/cf-ui
          path: frontend
          token: ${{ secrets.TOKEN }}
      
      - name: Checkout backend repository
        uses: actions/checkout@v3
        with:
          repository: CodingFolks/cf-service
          path: backend
          token: ${{ secrets.TOKEN }}
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}
      
      - name: Build and push Frontend Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/frontent:latest
          build-args: |
            BUILDKIT_INLINE_CACHE=0
          no-cache: true
      
      - name: Build and push Backend Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/backend:latest
          build-args: |
            BUILDKIT_INLINE_CACHE=0
      
      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: 'placeholder'
          if_key_exists: replace
      
      - name: Setup known hosts
        run: ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts
      
      - name: Clean up server environment
        run: |
          ssh root@${{ secrets.SERVER_IP }} "cd /root/kareem && docker compose down -v || true"
          ssh root@${{ secrets.SERVER_IP }} "docker rmi ${{ secrets.DOCKER_HUB_USERNAME }}/frontent:latest ${{ secrets.DOCKER_HUB_USERNAME }}/backend:latest || true"
          ssh root@${{ secrets.SERVER_IP }} "docker system prune -f"
          ssh root@${{ secrets.SERVER_IP }} "mkdir -p /root/kareem"
      
      - name: Create docker-compose file for full stack
        run: |
          cat > docker-compose.yml << 'EOL'
          version: '3.8'
          services:
            frontend:
              container_name: frontend
              image: ${{ secrets.DOCKER_HUB_USERNAME }}/frontent:latest
              restart: always
              ports:
                - "9000:9000"
              networks:
                - app-network
              
            backend:
              container_name: backend
              image: ${{ secrets.DOCKER_HUB_USERNAME }}/backend:latest
              restart: always
              ports:
                - "5000:5000"
              environment:
                - DB_USER=dbuser
                - DB_PASSWORD=dbpassword
                - DB_NAME=usersdb
                - DB_HOST=postgres
                - DB_PORT=5432
                - JWT_SECRET=${{ secrets.JWT_SECRET }}
              depends_on:
                - postgres
              networks:
                - app-network
          
            postgres:
              container_name: postgres
              image: postgres:14
              restart: always
              environment:
                - POSTGRES_USER=dbuser
                - POSTGRES_PASSWORD=dbpassword
                - POSTGRES_DB=usersdb
              volumes:
                - postgres_data:/var/lib/postgresql/data
              networks:
                - app-network
          
          networks:
            app-network:
              driver: bridge
          
          volumes:
            postgres_data:
          EOL
      
      - name: Deploy to server
        run: |
          scp docker-compose.yml root@${{ secrets.SERVER_IP }}:/root/kareem/
          ssh root@${{ secrets.SERVER_IP }} "cd /root/kareem && docker compose pull && docker compose up -d --force-recreate"
          
      - name: Verify deployment
        run: |
          ssh root@${{ secrets.SERVER_IP }} "docker ps -a"
          ssh root@${{ secrets.SERVER_IP }} "docker logs frontend"
          ssh root@${{ secrets.SERVER_IP }} "docker logs backend"
